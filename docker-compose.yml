name: waka-poc
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: waka
      POSTGRES_DB: waka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waka -d waka"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Explicit one-shot bootstrap for this standalone POC, not a Replit
  # deployment migration hook. Existing data is never reset by this command.
  initialize:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &api-environment
      DATABASE_URL: postgresql+psycopg://waka:${POSTGRES_PASSWORD}@db:5432/waka
      DEMO_MODE: ${DEMO_MODE:-true}
      ENVIRONMENT: ${ENVIRONMENT:-demo}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
      PAYMENT_PROVIDER_MODE: simulated
      MESSAGING_PROVIDER_MODE: simulated
      GATE_PROVIDER_MODE: simulated
    command: ["sh", "-c", "python -m backend.migrate && python -m backend.seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *api-environment
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/db', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      PORT: "3000"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres-data: