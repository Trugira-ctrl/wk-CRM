kind = "api"
previewPath = "/api"
title = "WAKA FastAPI"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/health"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["python", "-m", "compileall", "-q", "backend"]

[services.production.run]
args = ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"
ENVIRONMENT = "production"

[services.production.health.startup]
path = "/api/healthz"